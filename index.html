<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expenses</title>
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="app-header">
  <h1 id="view-title">Summary</h1>
  <span id="sync-indicator" class="sync-indicator" hidden></span>
  <button type="button" id="settings-btn" class="header-btn" aria-label="Backup and settings">⚙</button>
</header>
<div id="update-banner" class="update-banner" hidden>
  <span id="update-banner-text"></span>
  <button type="button" id="update-banner-btn">Reload</button>
</div>
<main id="view-container" class="view-container"></main>
<nav class="bottom-nav">
  <button type="button" class="nav-btn active" data-view="summary">
    <span class="nav-icon">📊</span><span>Summary</span>
  </button>
  <button type="button" class="nav-btn" data-view="plan">
    <span class="nav-icon">🎯</span><span>Plan</span>
  </button>
  <button type="button" class="nav-btn" data-view="add">
    <span class="nav-icon">➕</span><span>Add</span>
  </button>
  <button type="button" class="nav-btn" data-view="coach">
    <span class="nav-icon">🧠</span><span>Coach</span>
  </button>
  <button type="button" class="nav-btn" data-view="accounts">
    <span class="nav-icon">💳</span><span>Cards</span>
  </button>
  <button type="button" class="nav-btn" data-view="transactions">
    <span class="nav-icon">📒</span><span>History</span>
  </button>
</nav>
<script type="module" src="./js/app.js"></script>
</body>
</html>
